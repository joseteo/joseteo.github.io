# Secret scan (secret-hound template). Runs the gitleaks CLI binary, pinned by
# version AND sha256, on every push and pull request. It does not use
# gitleaks/gitleaks-action, which needs a paid license for organization repos.
#
# push:              scans the pushed commits (before..after); a new branch scans
#                    what it adds on top of the default branch; the very first
#                    push of the default branch scans the full history.
# pull_request:      scans the PR commits (base..head).
# workflow_dispatch: full history scan.
# Output is redacted and summary only (rule, file, line, commit): no values.
# Config: .gitleaks.toml at the repo root; exceptions: .gitleaksignore.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          install -m 0755 "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks-bin"
          "$RUNNER_TEMP/gitleaks-bin" version

      - name: Scan for secrets (redacted)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          range=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] \
               && ! printf '%s' "$PUSH_BEFORE" | grep -Eq '^0+$' \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$DEFAULT_BRANCH" ] \
               && git rev-parse -q --verify "refs/remotes/origin/$DEFAULT_BRANCH" >/dev/null \
               && [ "$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")" != "$PUSH_AFTER" ]; then
            range="refs/remotes/origin/$DEFAULT_BRANCH..$PUSH_AFTER"
          fi
          args=(git --redact --no-banner --no-color --log-level warn
                --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" --exit-code 0)
          [ -f .gitleaks.toml ] && args+=(--config .gitleaks.toml)
          [ -n "$range" ] && args+=(--log-opts "$range")
          echo "scan range: ${range:-full history}"
          "$RUNNER_TEMP/gitleaks-bin" "${args[@]}" .
          count=$(jq 'length' "$RUNNER_TEMP/gitleaks.json")
          if [ "$count" -gt 0 ]; then
            echo "::error::gitleaks found $count potential secret(s). Values are redacted; rotate anything real."
            jq -r '.[] | "  [\(.RuleID)] \(.File):\(.StartLine) commit=\(.Commit[0:10]) fingerprint=\(.Fingerprint)"' "$RUNNER_TEMP/gitleaks.json"
            exit 1
          fi
          echo "no secrets found"
